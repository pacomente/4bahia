# Arma el instalador de Voxelia para Windows en una máquina Windows de GitHub.
# - En cada push a main que toque voxelia/: deja el instalador como artefacto descargable (Actions → la corrida → Artifacts).
# - Además publica una Release pública por versión (voxelia-vX.Y.Z, según package.json), con link permanente.
name: Voxelia · instalador Windows

on:
  push:
    branches: [main]
    paths: ['voxelia/**', '.github/workflows/voxelia.yml']
    tags: ['voxelia-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voxelia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voxelia/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Voxelia-Windows
          path: |
            voxelia/release/*.exe
            voxelia/release/*.zip
          if-no-files-found: error
          retention-days: 30
      # Release pública (link permanente, sin cuenta de GitHub): una por versión de package.json.
      # Se crea sola en main la primera vez que aparece una versión nueva; con un tag "voxelia-v*" usa ese tag.
      - name: Publicar release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/voxelia-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="voxelia-v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG ya existe"; exit 0; fi
          gh release create "$TAG" release/*.exe release/*.zip --target "$GITHUB_SHA" --title "Voxelia ${TAG#voxelia-v}" --notes "Instalador para Windows (64 bits). Descargá Voxelia-Setup-${TAG#voxelia-v}.exe, ejecutalo y abrí Voxelia desde el escritorio. Si Windows muestra 'Windows protegió tu PC', tocá 'Más información' y luego 'Ejecutar de todas formas' (el instalador no está firmado con un certificado pago)."
